<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf6ed">
<title>写随记</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #faf6ed; color: #3e3e3e; min-height: 100dvh;
    display: flex; flex-direction: column;
  }
  .header { padding: 16px 20px 8px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 1.1rem; font-weight: 600; }
  .header a { font-size: 0.85rem; color: #888; text-decoration: none; }
  .main { flex: 1; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  textarea {
    flex: 1; min-height: 160px; width: 100%; padding: 16px;
    font-size: 16px; line-height: 1.8; font-family: inherit;
    border: 1.5px solid #e0d8c8; border-radius: 12px;
    background: #fff; color: #3e3e3e; resize: none; outline: none;
    transition: border-color .2s;
  }
  textarea:focus { border-color: #4FC3F7; }
  .token-row { display: flex; gap: 8px; align-items: center; }
  .token-row input {
    flex: 1; padding: 10px 12px; font-size: 14px; border: 1.5px solid #e0d8c8;
    border-radius: 10px; background: #fff; outline: none;
  }
  .token-row input:focus { border-color: #4FC3F7; }
  .token-row input::placeholder { color: #c0b8a4; }
  button {
    width: 100%; padding: 14px; font-size: 17px; font-weight: 600;
    border: none; border-radius: 12px; cursor: pointer;
    background: #4FC3F7; color: #fff; letter-spacing: 0.05em;
    transition: opacity .2s;
  }
  button:active { opacity: 0.8; }
  button:disabled { background: #c0d8e0; }
  .toast {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    padding: 10px 24px; border-radius: 20px; font-size: 14px; color: #fff;
    background: #3e3e3e; opacity: 0; transition: opacity .3s; pointer-events: none;
    white-space: nowrap; z-index: 10;
  }
  .toast.show { opacity: 0.9; }
  .toast.ok { background: #4caf50; }
  .toast.err { background: #e53935; }
  .hint { font-size: 12px; color: #b0a898; text-align: center; }
  .history { margin-top: 4px; }
  .history summary { font-size: 13px; color: #b0a898; cursor: pointer; padding: 4px 0; }
  .history ul { list-style: none; padding: 0; margin-top: 8px; }
  .history li { font-size: 13px; color: #888; padding: 4px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
  .history li span { color: #aaa; font-size: 11px; }
</style>
</head>
<body>
<div class="header">
  <h1>写随记</h1>
  <a href="#" onclick="toggleToken()" id="token-link">设置</a>
</div>
<div class="main">
  <div class="token-row" id="token-row" style="display:none">
    <input type="password" id="token" placeholder="GitHub Personal Access Token" autocomplete="off">
  </div>
  <textarea id="text" placeholder="写点什么…" autofocus></textarea>
  <button onclick="submit()" id="btn">发送</button>
  <div class="hint">通过 GitHub API 直接写入博客仓库，无需 VPN</div>

  <details class="history">
    <summary>最近发送</summary>
    <ul id="history-list"></ul>
  </details>
</div>
<div class="toast" id="toast"></div>

<script>
const REPO = "iiwenwen/iiwenwen.github.io";
const PATH = "src/content/posts";
const BRANCH = "main";
const HISTORY_KEY = "write_history";

const tokenInput = document.getElementById("token");
const tokenRow = document.getElementById("token-row");
const textEl = document.getElementById("text");
const btn = document.getElementById("btn");
const toast = document.getElementById("toast");
const tokenLink = document.getElementById("token-link");
const historyList = document.getElementById("history-list");

let token = localStorage.getItem("gh_token_write") || "";
if (token) {
  tokenInput.value = token;
  tokenLink.textContent = "已设";
}

renderHistory();

function toggleToken() {
  const show = tokenRow.style.display === "none";
  tokenRow.style.display = show ? "flex" : "none";
  if (show) tokenInput.focus();
}

function showToast(msg, type) {
  toast.textContent = msg;
  toast.className = "toast " + type + " show";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { toast.className = "toast"; }, 2500);
}

function addHistory(text) {
  const items = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
  items.unshift({ text: text.slice(0, 60), time: Date.now() });
  localStorage.setItem(HISTORY_KEY, JSON.stringify(items.slice(0, 20)));
  renderHistory();
}

function renderHistory() {
  const items = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
  historyList.innerHTML = items.map(i =>
    `<li>${esc(i.text)}<span>${fmtTime(i.time)}</span></li>`
  ).join("");
}

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function fmtTime(ts) {
  const d = new Date(ts);
  return d.toLocaleString("zh-CN", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" });
}

async function submit() {
  const text = textEl.value.trim();
  if (!text) { showToast("写点什么吧", "err"); return; }

  token = tokenInput.value.trim() || token;
  if (!token) { showToast("请先设置 GitHub Token", "err"); tokenRow.style.display = "flex"; return; }
  localStorage.setItem("gh_token_write", token);
  tokenLink.textContent = "已设";

  btn.disabled = true;
  btn.textContent = "发送中…";

  try {
    const now = new Date();
    const ts = now.toISOString().replace(/[:.]/g, "-").slice(0, 19);
    const filename = ts + ".md";
    const dateStr = now.toISOString().replace("T", " ").slice(0, 16);

    const title = text.split(/[\n。！？,，]/)[0].slice(0, 30).trim() || "随记";
    const content = [
      "---",
      `title: "${title}"`,
      `date: ${dateStr}`,
      "category: daily",
      "---",
      "",
      text
    ].join("\n");

    const base64 = btoa(unescape(encodeURIComponent(content)));

    const resp = await fetch(
      `https://api.github.com/repos/${REPO}/contents/${PATH}/${filename}`,
      {
        method: "PUT",
        headers: {
          "Authorization": `token ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: `daily: ${title}`,
          content: base64,
          branch: BRANCH
        })
      }
    );

    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.message || resp.statusText);
    }

    textEl.value = "";
    addHistory(text);
    showToast("已发送", "ok");
  } catch (e) {
    showToast("失败: " + e.message, "err");
  } finally {
    btn.disabled = false;
    btn.textContent = "发送";
  }
}

textEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.metaKey && !e.ctrlKey) {
    e.preventDefault();
    submit();
  }
});
</script>
</body>
</html>
